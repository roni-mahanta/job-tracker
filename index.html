<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Job Application Tracker</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Job Application Tracker</h1>
        <p>Track your job applications easily.</p>
    </header>

    <main>

        <!-- Dashboard -->

        <section class="dashboard">

            <div class="card">
                <h3>Total Applications</h3>
                <p id="totalApplications">0</p>
            </div>

            <div class="card">
                <h3>Applied</h3>
                <p id="appliedCount">0</p>
            </div>

            <div class="card">
                <h3>Interview</h3>
                <p id="interviewCount">0</p>
            </div>

            <div class="card">
                <h3>Selected</h3>
                <p id="selectedCount">0</p>
            </div>

        </section>


        <!-- Add Job -->

        <section>

            <h2>Add Application</h2>

            <form id="jobForm">

                <input
                    type="text"
                    id="company"
                    placeholder="Company name"
                    required
                >

                <input
                    type="text"
                    id="role"
                    placeholder="Job role"
                    required
                >

                <select id="status">

                    <option value="Applied">
                        Applied
                    </option>

                    <option value="Interview">
                        Interview
                    </option>

                    <option value="Selected">
                        Selected
                    </option>

                    <option value="Rejected">
                        Rejected
                    </option>

                </select>

                <button type="submit">
                    Add Application
                </button>

            </form>

        </section>


        <!-- Search -->

        <section>

            <input
                type="text"
                id="searchInput"
                placeholder="Search company or role..."
            >

        </section>


        <!-- Applications -->

        <section>

            <h2>Applications</h2>

            <div id="jobList"></div>

        </section>

    </main>

    <script type="module" src="js/main.js"></script>

</body>

</html>
